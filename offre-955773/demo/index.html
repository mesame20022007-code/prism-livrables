<style>
  :root{--vio:#4C2A75;--vio2:#6a3fa0;--or:#E8B84A;--bg:#faf7ff;--card:#fff;--ink:#1c1530;--mut:#6d6585;--line:#e4dcf3;--rouge:#c62828;--orange:#d97a00;--vert:#1f8a55}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:110px}
  body.noscroll{overflow:hidden}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  header{background:var(--vio);color:#fff;padding:14px 14px 16px}
  header .row{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
  header h1{font-size:20px;margin:0}
  header small{opacity:.8;display:block;font-size:13px}
  .ic{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:12px;min-width:46px;min-height:46px;font-size:20px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .cards .c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .cards .c.big{grid-column:1/3;background:var(--vio);color:#fff;border:0}
  .cards .c span{display:block;font-size:13px;color:var(--mut)}
  .cards .c.big span{color:#d9c9f2}
  .cards .c b{font-size:22px}
  .cards .c.big b{font-size:30px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
  .chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 14px;font-size:15px;min-height:44px}
  .chip.on{background:var(--vio);border-color:var(--vio);color:#fff}
  .debt{background:var(--card);border:1px solid var(--line);border-left-width:6px;border-radius:14px;padding:12px;margin-bottom:10px}
  .debt.late{border-left-color:var(--rouge)} .debt.soon{border-left-color:var(--orange)} .debt.ok{border-left-color:var(--vert)} .debt.paid{border-left-color:#bbb;opacity:.75}
  .debt .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .debt .nm{font-weight:700;font-size:18px}
  .debt .ob{color:var(--mut);font-size:14px}
  .debt .am{font-weight:800;font-size:19px;white-space:nowrap}
  .tag{display:inline-block;font-size:13px;padding:3px 9px;border-radius:999px;margin-top:6px;font-weight:600}
  .tag.late{background:#fde7e7;color:var(--rouge)} .tag.soon{background:#fff0d9;color:var(--orange)} .tag.ok{background:#e1f5ea;color:var(--vert)} .tag.paid{background:#eee;color:#666}
  .acts{display:flex;gap:8px;margin-top:10px}
  .btn{border:0;border-radius:12px;min-height:48px;padding:0 16px;font-size:16px;font-weight:700;background:var(--vio);color:#fff;flex:1}
  .btn.sec{background:#efe8fb;color:var(--vio)}
  .btn.wa{background:#1fa855}
  .btn.red{background:#fde7e7;color:var(--rouge)}
  .btn.gold{background:var(--or);color:#2b1c00}
  .fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--or);color:#2b1c00;border:0;border-radius:999px;min-height:58px;padding:0 22px;font-size:18px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:5}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--mut)}
  .banner{background:#fff6dc;border:1px solid #f0d58a;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:15px}
  label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
  input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:48px}
  textarea{min-height:150px;resize:vertical}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px;min-height:40px}
  .sheetbg{position:fixed;inset:0;background:rgba(20,10,40,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .sheet h2{margin:0 0 4px;font-size:20px}
  .sheet .x{float:right;background:#efe8fb;border:0;border-radius:10px;min-width:44px;min-height:44px;font-size:18px}
  .tones{display:flex;gap:8px}
  .tones button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;min-height:46px;font-size:15px;font-weight:700}
  .tones button.on{background:var(--vio);color:#fff;border-color:var(--vio)}
  details.more{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
  details.more summary{font-weight:700;cursor:pointer;min-height:36px;display:flex;align-items:center}
  .note{font-size:14px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:10px}
  .note.warn{background:#fff0d9;border-color:#f3c98a;color:#7a4a00}
  .bar{height:10px;background:#e9e1f7;border-radius:999px;overflow:hidden;margin:8px 0}
  .bar i{display:block;height:100%;background:var(--vert)}
  .hist{font-size:14px;color:var(--mut);margin:0;padding-left:18px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#2a1b45;color:#fff;border-radius:12px;padding:12px 16px;z-index:40;max-width:90%;font-size:15px}
  .sub{font-size:14px;color:var(--mut)}
  h3{margin:18px 0 6px;font-size:17px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{text-align:left;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;min-height:50px;padding:10px 14px;font-size:16px}
  .opt.on{background:var(--vio);border-color:var(--vio);color:#fff;font-weight:700}
  .doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;font:16px/1.6 Georgia,"Times New Roman",serif;color:#111}
  .doc h2{text-align:center;font-size:20px;margin:0 0 14px;letter-spacing:1px}
  .doc p{margin:0 0 10px}
  .doc .box{border:2px solid #111;padding:10px;margin:14px 0}
  .doc .sig{margin-top:18px}
  .doc .ln{display:inline-block;border-bottom:1px solid #111;min-width:200px}
  .doc ul{margin:0 0 10px;padding-left:22px}
  .ok2{background:#e1f5ea;border:1px solid #9fd8b9;border-radius:10px;padding:8px 10px;color:#14633c;font-size:15px;margin-top:10px}
  #printzone{display:none}
  @media print{
    #app,#modal,.fab,.toast{display:none!important}
    body{background:#fff;padding:0}
    #printzone{display:block;padding:18mm 16mm;font:14pt/1.6 Georgia,"Times New Roman",serif;color:#000}
    #printzone h2{text-align:center;font-size:18pt;margin:0 0 12mm}
    #printzone p{margin:0 0 4mm}
    #printzone .box{border:2px solid #000;padding:4mm;margin:6mm 0}
    #printzone .sig{margin-top:9mm}
    #printzone .ln{display:inline-block;border-bottom:1px solid #000;min-width:70mm}
  }
</style>

<script>
(function(){
'use strict';
var KEY='cc_demo', DAY=86400000, FEEDBACK_URL='', FEEDBACK_DAYS=30;
var S=load(), UI={view:'home',filter:'all',id:null}, relDraft=null;
var DEMO_NEW=!S.debts.length; if(!S.me) S.me='Boutique Mama Ola (démo)';

function load(){
  try{var r=sessionStorage.getItem(KEY); if(r){var o=JSON.parse(r); if(o&&o.debts) return o;}}catch(e){}
  return {v:1,me:'',debts:[],lastBackup:0};
}
function save(){
  try{sessionStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast("Impossible d'enregistrer : mémoire pleine ou navigation privée.");}
}
function uid(){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}
function parse(s){var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2],12,0,0);}
function addDays(s,n){var d=parse(s); d.setDate(d.getDate()+n); return iso(d);}
function diff(a,b){return Math.round((parse(a)-parse(b))/DAY);}
function fr(s){if(!s) return ''; var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0];}
function F(n){n=Math.round(+n||0); return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' F';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function paid(d){var t=0; (d.pay||[]).forEach(function(p){t+=+p.a||0;}); return t;}
function rest(d){return Math.max(0,(+d.amount||0)-paid(d));}
function late(d){return rest(d)>0 ? diff(today(),d.due) : 0;}
function status(d){
  if(rest(d)<=0) return 'paid';
  var l=diff(today(),d.due);
  if(l>0) return 'late';
  if(l>=-3) return 'soon';
  return 'ok';
}
function lastRel(d){var r=d.rel||[]; return r.length? r[r.length-1].t : 0;}
function daysSinceRel(d){var t=lastRel(d); return t? Math.floor((Date.now()-t)/DAY) : 999;}
/* Plan de relance semi-automatique : l'application propose chaque jour la bonne étape, tu appuies pour envoyer */
var PLAN=[
 {d:-3,k:'rappel',tone:'doux',l:'Rappel amical'},
 {d:0,k:'jourj',tone:'doux',l:'Jour de l’échéance'},
 {d:2,k:'retard',tone:'normal',l:'Premier retard'},
 {d:7,k:'retard',tone:'ferme',l:'Retard d’une semaine'},
 {d:15,k:'dernier',tone:'normal',l:'Dernier rappel'},
 {d:30,k:'dernier',tone:'ferme',l:'Avant procédure'}
];
function planDone(d,i){return (d.rel||[]).some(function(x){return x.p===i;});}
function planDate(d,i){return addDays(d.due,PLAN[i].d);}
function nextStep(d){
  if(d.auto===false || rest(d)<=0) return -1;
  var t=today(), best=-1;
  for(var i=0;i<PLAN.length;i++){ if(planDate(d,i)<=t && !planDone(d,i)) best=i; }
  if(best>-1){ for(var j=best+1;j<PLAN.length;j++) if(planDone(d,j)) return -1; }
  return best;
}
function toRelaunch(d){
  if(d.auto!==false) return nextStep(d)>-1;
  var s=status(d); return (s==='late'||(s==='soon'&&diff(today(),d.due)>=0)) && daysSinceRel(d)>=2;
}
var PAYS=[['229','Bénin',1],['225','Côte d’Ivoire',1],['228','Togo',0],['221','Sénégal',0],['226','Burkina Faso',0],['223','Mali',0],['227','Niger',0],['224','Guinée',0],['241','Gabon',0],['237','Cameroun',0]];
function paysOf(){var c=S.cc||'229'; for(var i=0;i<PAYS.length;i++) if(PAYS[i][0]===c) return PAYS[i]; return PAYS[0];}
function waNumber(p){
  if(!p) return '';
  var raw=String(p), s=raw.replace(/[^\d+]/g,'');
  if(s.charAt(0)==='+') return s.slice(1);
  s=s.replace(/^00/,'');
  var pa=paysOf(), cc=pa[0];
  if(raw.replace(/\s/g,'').indexOf('00')===0) return s;
  if(cc==='229'){
    if(s.indexOf('229')===0){ if(s.length===11) return '229'+'01'+s.slice(3); return s; }
    if(s.length===10 && s.indexOf('01')===0) return '229'+s;
    if(s.length===8) return '22901'+s;
    return s;
  }
  if(s.indexOf(cc)===0 && s.length>=cc.length+8) return s;
  if(pa[2]) return cc+s;
  return cc+s.replace(/^0+/,'');
}
function toast(t){
  var e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e);
  setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },2800);
}

/* ---------- MESSAGES DE RELANCE : 8 situations x 3 tons ---------- */
var SIT=[
 {k:'rappel',l:'Rappel avant l’échéance',
  doux:"Bonjour {nom}, j'espère que vous allez bien. Petit rappel amical : votre paiement de {reste} ({objet}) est prévu le {echeance}. Merci d'avance ! — {moi}",
  normal:"Bonjour {nom}. Je vous rappelle que {reste} est à régler le {echeance} pour {objet}. Pouvez-vous me confirmer que ce sera bon ? Merci. — {moi}",
  ferme:"Bonjour {nom}. Le {echeance}, vous devez me payer {reste} ({objet}). Merci de me confirmer ce jour-là l'heure et le moyen de paiement (Mobile Money ou main à main). — {moi}"},
 {k:'retard',l:'Premier retard',
  doux:"Bonjour {nom}, j'espère que tout va bien. Je pense que le paiement de {reste} ({objet}), prévu le {echeance}, a peut-être été oublié. Pouvez-vous me dire quand vous pourrez le régler ? Merci beaucoup. — {moi}",
  normal:"Bonjour {nom}. Le paiement de {reste} ({objet}) était prévu le {echeance} et n'est pas encore arrivé ({jours} jours de retard). Merci de me dire aujourd'hui quand vous pouvez me payer. — {moi}",
  ferme:"Bonjour {nom}. Vous avez {jours} jours de retard sur {reste} ({objet}). J'attends votre paiement dans les 48 heures. Si vous avez une difficulté, dites-le-moi maintenant pour que nous trouvions une solution. — {moi}"},
 {k:'promet',l:'Il promet encore (« demain »)',
  doux:"Bonjour {nom}, merci pour votre réponse. Je note que vous me payez {reste} le {promesse}. Pouvez-vous me confirmer cette date ? Je compte sur vous. — {moi}",
  normal:"Bonjour {nom}. D'accord, je note votre promesse de me payer {reste} le {promesse}. C'est la date finale : sans paiement ce jour-là, je ne pourrai plus vous faire crédit. Merci. — {moi}",
  ferme:"Bonjour {nom}. Vous m'avez déjà promis plusieurs fois. Je note votre dernière promesse : {reste} le {promesse}, sans faute. Après cette date, je prendrai d'autres dispositions et je ne ferai plus de crédit. — {moi}"},
 {k:'silence',l:'Il ne répond plus',
  doux:"Bonjour {nom}, j'espère que vous allez bien. Je n'ai pas de nouvelles depuis un moment. Je voulais juste savoir comment nous pouvons régler les {reste} ({objet}). Répondez-moi quand vous voyez ce message, merci. — {moi}",
  normal:"Bonjour {nom}. Je vous ai écrit plusieurs fois sans réponse au sujet de {reste} ({objet}). Merci de me répondre aujourd'hui, même pour me dire quand vous pouvez payer. — {moi}",
  ferme:"Bonjour {nom}. Sans réponse de votre part, je ne peux pas considérer cette dette comme réglée : {reste} ({objet}), {jours} jours de retard. Répondez-moi avant demain soir pour qu'on trouve un arrangement. — {moi}"},
 {k:'dejapaye',l:'Il dit avoir déjà payé',
  doux:"Bonjour {nom}, merci pour votre message. Je ne retrouve pas ce paiement de mon côté. Pouvez-vous m'envoyer la preuve (capture Mobile Money ou date et montant) ? Je vérifie tout de suite. — {moi}",
  normal:"Bonjour {nom}. Selon mon cahier, il reste {reste} sur {total} ({objet}). Si vous avez payé, envoyez-moi la preuve (capture Mobile Money, date, montant) et je corrige. — {moi}",
  ferme:"Bonjour {nom}. Mon cahier indique {reste} non payés. Sans preuve de paiement (capture, reçu), je dois considérer que la dette reste due. Merci de me l'envoyer aujourd'hui. — {moi}"},
 {k:'delai',l:'Il demande un délai ou des tranches',
  doux:"Bonjour {nom}, je comprends votre situation. Nous pouvons faire par tranches : par exemple 3 paiements ({tranches}) pour finir {reste}. Dites-moi ce qui vous convient et on se met d'accord. — {moi}",
  normal:"Bonjour {nom}. D'accord pour un paiement en 3 fois : {tranches}, le premier le {promesse}, puis chaque semaine. Si un paiement manque, le reste devient dû tout de suite. Confirmez-moi par message. — {moi}",
  ferme:"Bonjour {nom}. J'accepte un dernier arrangement : 3 paiements ({tranches}), le premier le {promesse}. Aucun nouveau crédit tant que tout n'est pas payé. Confirmez avant ce soir. — {moi}"},
 {k:'conteste',l:'Il conteste le montant',
  doux:"Bonjour {nom}, merci de me le dire. Voici le détail de mon cahier : {objet}, total {total}, déjà payé {paye}, reste {reste}. Dites-moi ce qui ne correspond pas et nous vérifions ensemble. — {moi}",
  normal:"Bonjour {nom}. D'après mon cahier : {objet} = {total} (donné le {datedette}), payé {paye}, reste {reste}. Si vous pensez qu'il y a une erreur, dites-moi exactement quel point et envoyez vos preuves. — {moi}",
  ferme:"Bonjour {nom}. Mon cahier est clair : {total} pour {objet}, payé {paye}, reste {reste}. Si vous contestez, envoyez-moi vos preuves aujourd'hui, sinon je considère le montant comme exact. — {moi}"},
 {k:'dernier',l:'Dernier avertissement',
  doux:"Bonjour {nom}. Je ne veux pas en arriver là, mais la dette de {reste} ({objet}) dure depuis {jours} jours. Je vous demande de la régler avant le {promesse}. Parlons-en, je suis prêt(e) à trouver une solution. — {moi}",
  normal:"Bonjour {nom}. Dernier rappel : {reste} ({objet}), {jours} jours de retard. Sans paiement avant le {promesse}, je serai obligé(e) de passer par une procédure officielle de recouvrement. — {moi}",
  ferme:"Bonjour {nom}. Dernier avertissement : {reste} dus pour {objet}. Sans paiement avant le {promesse}, je ferai une lettre officielle de mise en demeure, puis je demanderai l'aide d'un huissier. — {moi}"},
 /* --- v1.5 : plus de situations --- */
 {k:'avant',l:'Avant de donner : mes conditions',
  doux:"Bonjour {nom}, avec plaisir pour {objet} ({total}). Pour que tout soit clair entre nous : paiement de {total} avant le {echeance}. Si ça vous convient, je vous prépare ça. — {moi}",
  normal:"Bonjour {nom}. Pour {objet} à crédit ({total}) : paiement complet le {echeance}, pas de nouveau crédit tant que ce n'est pas payé. Vous êtes d'accord ? Je note tout dans mon cahier. — {moi}",
  ferme:"Bonjour {nom}. Je peux vous donner {objet} ({total}) à crédit seulement si : 1) paiement avant le {echeance}, 2) vous confirmez ici par écrit. Sans votre accord écrit, pas de crédit. — {moi}"},
 {k:'refus',l:'Refuser un crédit poliment',
  doux:"Bonjour {nom}, merci de votre confiance. En ce moment je ne peux pas donner à crédit, mon stock est payé comptant. Si vous payez une partie maintenant, je vous sers volontiers. — {moi}",
  normal:"Bonjour {nom}. Je ne fais plus de crédit tant que les anciens paiements ne sont pas réglés. Dès que c'est fait, nous en reparlons avec plaisir. — {moi}",
  ferme:"Bonjour {nom}. Ma décision est prise : pas de nouveau crédit pour le moment. Je vends au comptant, et je serai content(e) de vous servir ainsi. — {moi}"},
 {k:'jourj',l:'Le jour de l’échéance',
  doux:"Bonjour {nom}, bonne journée ! C'est aujourd'hui le jour prévu pour {reste} ({objet}). Merci de me dire à quelle heure vous passez ou envoyez. — {moi}",
  normal:"Bonjour {nom}. Aujourd'hui {echeance}, c'est le paiement de {reste} ({objet}). Je compte sur vous ce jour. Mobile Money ou main à main, dites-moi. — {moi}",
  ferme:"Bonjour {nom}. Nous sommes le {echeance} : {reste} doivent m'être payés aujourd'hui, comme convenu. Confirmez-moi le paiement avant ce soir. — {moi}"},
 {k:'momo',l:'Où envoyer le paiement (Mobile Money)',

function sitOf(k){for(var i=0;i<SIT.length;i++) if(SIT[i].k===k) return SIT[i]; return SIT[1];}

function build(d,k,tone,promesse){
  var tpl=sitOf(k)[tone]||sitOf(k).normal;
  var r=rest(d), t3=Math.ceil(r/3/100)*100;
  var vals={nom:d.name,reste:F(r),total:F(d.amount),paye:F(paid(d)),objet:d.obj||'votre achat',echeance:fr(d.due),
    jours:Math.max(1,late(d)),promesse:fr(promesse),datedette:fr(d.date),dernier:((d.pay&&d.pay.length)?F(d.pay[d.pay.length-1].a):F(0)),tranche3:F(t3),tranches:F(t3)+', '+F(t3)+' puis '+F(Math.max(0,r-2*t3)),
    garant:d.gname||'Monsieur/Madame',quartier:d.where||'habituel',monnum:S.myphone||'[mon numéro]'};
  var out=tpl.replace(' — {moi}', S.me? ' — '+S.me : '');

function find(id){for(var i=0;i<S.debts.length;i++) if(S.debts[i].id===id) return S.debts[i]; return null;}

  var sa=status(a), sb=status(b), ord={late:0,soon:1,ok:2,paid:3};
  if(ord[sa]!==ord[sb]) return ord[sa]-ord[sb];
  if(sa==='late') return late(b)-late(a);
  return parse(a.due)-parse(b.due);
}
function chipText(d){
  var s=status(d), l=diff(today(),d.due);
  if(s==='paid') return 'Payée';
  if(s==='late') return 'En retard de '+l+' jour'+(l>1?'s':'');
  if(l===0) return 'À payer aujourd’hui';
  return 'À payer le '+fr(d.due)+' (dans '+(-l)+' j)';
}

/* ---------- RECONNAISSANCE DE DETTE ---------- */
var RC=null;
function toWords(n){
  n=Math.floor(Math.abs(+n||0));
  if(n===0) return 'zéro';
  var u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  var t=['','','vingt','trente','quarante','cinquante','soixante'];
  function b100(x,fin){
    if(x<20) return u[x];
    var d=Math.floor(x/10), r=x%10;
    if(d===7){ if(r===0) return 'soixante-dix'; if(r===1) return 'soixante et onze'; return 'soixante-'+u[10+r]; }
    if(d===9){ return 'quatre-vingt-'+u[10+r]; }
    if(d===8){ return r===0 ? 'quatre-vingt'+(fin?'s':'') : 'quatre-vingt-'+u[r]; }
    if(r===0) return t[d];
    if(r===1) return t[d]+' et un';
    return t[d]+'-'+u[r];
  }
  function b1000(x,fin){
    var c=Math.floor(x/100), r=x%100, s='';
    if(c>0){ s=(c===1)?'cent':u[c]+' cent'+((r===0&&fin)?'s':''); }
    if(r>0){ s+=(s?' ':'')+b100(r,fin); }
    return s;
  }
  var parts=[], bn=Math.floor(n/1e9), mn=Math.floor((n%1e9)/1e6), th=Math.floor((n%1e6)/1000), un=n%1000;
  if(bn) parts.push(b1000(bn,true)+' milliard'+(bn>1?'s':''));
  if(mn) parts.push(b1000(mn,true)+' million'+(mn>1?'s':''));
  if(th) parts.push(th===1?'mille':b1000(th,false)+' mille');
  if(un) parts.push(b1000(un,true));
  return parts.join(' ');
}
function Fp(n){return String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function plan(total,n,per,start){
  var out=[], acc=0, base=Math.floor(total/n/100)*100;
  if(n<2) return [{a:total,d:start}];
  for(var i=0;i<n;i++){ var a=(i===n-1)? total-acc : base; acc+=a; out.push({a:a,d:addDays(start,i*per)}); }
  return out;
}
function ordinal(i){return i===1?'1er':i+'e';}

 {k:'q1',t:'Depuis quand connais-tu cette personne ?',o:[[3,'Plus d’un an'],[2,'3 à 12 mois'],[1,'Moins de 3 mois'],[0,'Je ne la connais pas vraiment']],w:'Tu la connais depuis peu de temps.'},

 {k:'q7',t:'Accepte-t-elle de signer un écrit et de verser une avance ?',o:[[3,'Oui, sans problème'],[1,'Elle hésite'],[0,'Elle refuse']],w:'Elle hésite ou refuse de signer et d’avancer de l’argent.'},
 {k:'q8',t:'Que t’a-t-on dit sur elle ?',o:[[3,'On me l’a recommandée'],[2,'Rien de particulier'],[0,'On m’a dit qu’elle paie mal']],w:'On t’a prévenu(e) qu’elle paie mal (ce n’est qu’un avis, garde-le en tête).'}
];
function evalTest(ans,amount,maxLoss){
  var s=0, weak=[];
  TQ.forEach(function(q){var v=+ans[q.k]||0; s+=v; if(v<=1) weak.push({v:v,w:q.w});});
  weak.sort(function(a,b){return a.v-b.v;});
  var v=s>=19?'vert':(s>=12?'orange':'rouge');
  if(ans.q2===0||ans.q3===0) v='rouge';
  if((ans.q5===0||ans.q7===0)&&v==='vert') v='orange';
  if(!(maxLoss>0)) maxLoss=amount;
  var fac=v==='vert'?0:(v==='orange'?0.3:1);
  var avance=Math.ceil(amount*fac/100)*100;
  var cred=0;
  if(v==='vert') cred=Math.min(amount,maxLoss);
  else if(v==='orange') cred=Math.min(amount-avance,Math.floor(maxLoss/2/100)*100);
  if(cred<0) cred=0;
  return {score:s,verdict:v,weak:weak.slice(0,3).map(function(x){return x.w;}),cred:cred,comptant:amount-cred,avance:Math.min(avance,amount),days:v==='vert'?15:(v==='orange'?21:0)};
}
